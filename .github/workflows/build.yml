on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  diagnose-right:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated config and build directories
        run: |
          echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"
          echo "base_dir=${TMPDIR:-/tmp}/zmk-config" >> "$GITHUB_ENV"
          echo "zephyr_version=${ZEPHYR_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "${TMPDIR:-/tmp}/zmk-config/config"
          cp -R config/* "${TMPDIR:-/tmp}/zmk-config/config/"
      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Fetch pinned sources
        run: |
          cd "$base_dir"
          west init -l "$base_dir/config"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Rebuild right half without firmware changes
        run: |
          cd "$base_dir"
          west build -s zmk/app -d "$build_dir" -b xiao_ble//zmk \
            -S studio-rpc-usb-uart -- \
            -DZMK_CONFIG="$base_dir/config" \
            '-DSHIELD=CLine46_R rgbled_adapter' \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE"
      - name: Check address mapping files
        run: |
          test -s "$build_dir/zephyr/zmk.elf"
          test -s "$build_dir/zephyr/zmk.map"
          test -s "$build_dir/zephyr/zmk.uf2"
          cp "$build_dir/zephyr/.config" "$build_dir/zephyr/zmk.config"
      - name: Upload address mapping files
        uses: actions/upload-artifact@v4
        with:
          name: right-address-map
          if-no-files-found: error
          path: |
            ${{ env.build_dir }}/zephyr/zmk.elf
            ${{ env.build_dir }}/zephyr/zmk.map
            ${{ env.build_dir }}/zephyr/zmk.uf2
            ${{ env.build_dir }}/zephyr/zmk.config
